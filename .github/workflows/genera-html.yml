name: Rigenera index.html

on:
  push:
    branches: [master]
    paths:
      - dati_torneo.json
      - genera.py

permissions:
  contents: write

jobs:
  rigenera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Genera index.html da dati_torneo.json
        run: python3 genera.py

      - name: Commit index.html se cambiato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Rigenera index.html da dati_torneo.json [skip ci]"
            git push
          else
            echo "index.html già aggiornato, nessun commit necessario"
          fi
